<h2>Code For This Model</h2>
<pre><code id="notebook-viewer" class="language-json">Loading notebook...</code></pre>
<link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>

<script>
    async function loadNotebook() {
        try {
            // Update './code/projectname.ipynb' to match your actual notebook filename if different
            const response = await fetch('./project_codes/6-or-7.ipynb');
            
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            
            const notebookJson = await response.json();
            const codeElement = document.getElementById('notebook-viewer');
            codeElement.textContent = JSON.stringify(notebookJson, null, 2);
            
            Prism.highlightElement(codeElement);
        } catch (error) {
            console.error('Failed to load notebook:', error);
            document.getElementById('notebook-viewer').textContent = 'Error loading notebook file.';
        }
    }

    loadNotebook();
</script>
